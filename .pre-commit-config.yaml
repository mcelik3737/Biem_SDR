repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: python -m uv run ruff check src tests
        language: system
        pass_filenames: false
      - id: format
        name: Format
        entry: python -m uv run ruff format --check src tests
        language: system
        pass_filenames: false
      - id: ty
        name: Type check (ty)
        entry: python -m uv run ty check
        language: system
        pass_filenames: false
      - id: basedpyright
        name: Type check (basedpyright)
        entry: python -m uv run basedpyright
        language: system
        pass_filenames: false
      - id: pytest
        name: Behavior tests
        entry: python -m uv run pytest -q
        language: system
        pass_filenames: false
