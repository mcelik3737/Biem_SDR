<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BIEM Radia — Operasyon / Güncel tasarım</title>
  <link rel="icon" href="assets/biem-amblem.png">
  <link rel="stylesheet" href="radia.css">
  <script src="assets/icons.js" defer></script>
  <script src="assets/map-data.js" defer></script>
  <script src="radia.js" defer></script>
</head>
<body>
  <div class="design-bar">
    <span><b>TASARIM ÖNİZLEMESİ · V2</b><span class="design-note"> Temsili veri · Alıcı, gerçek ses ve çevrimiçi harita bağlantısı yok</span></span>
    <div class="demo-controls">
      <label>Senaryo <select id="demo-scenario" aria-label="Tasarım senaryosu"><option value="normal">Normal akış</option><option value="simplex">DMR özel / çözücü kanalı</option><option value="scan">Tarama sırası</option><option value="file-error">Kayıt okuma hatası</option><option value="missing">Cihaz bulunamadı</option><option value="busy">Cihaz başka uygulamada</option><option value="map-empty">Konum yok</option><option value="map-stale">Eski konum</option><option value="map-tile">Eksik harita karosu</option></select></label>
      <label><input type="checkbox" id="demo-admin"> Yönetici görünümü <span>(temsili)</span></label>
    </div>
  </div>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand"><img src="assets/biem-logo.png" alt="Biem Elektronik"><span class="brand-divider"></span><strong>RADIA</strong><span class="product-name">İzleme ve kayıt</span></div>
      <div class="header-right"><span class="health"><i class="dot blue"></i><span id="global-status"></span></span><button class="button" data-action="fm-panel" id="fm-toggle" aria-expanded="false"><i data-icon="Radio"></i>FM RADIO</button><button class="button" id="receiver-toggle"></button></div>
    </header>
    <aside class="sidebar">
      <div class="workspace-label">SİSTEM / MÜŞTERİ</div>
      <div class="workspace-name"><span class="workspace-avatar">DT</span><span><strong>Demo tesis</strong><small>Temsili çalışma alanı</small></span></div>
      <nav class="navigation" aria-label="Ana gezinme">
        <button data-view="live" title="Canlı izleme"><i data-icon="Radio"></i><span>Canlı izleme</span><b class="nav-count">6</b></button>
        <button data-view="archive" title="Kayıt arşivi"><i data-icon="Archive"></i><span>Kayıt arşivi</span></button>
        <button data-view="map" title="Harita"><i data-icon="MapPin"></i><span>Harita</span><small>DEMO</small></button>
        <button data-view="directory" title="Kimlik rehberi"><i data-icon="Users"></i><span>Kimlik rehberi</span></button>
        <button data-view="logs" title="Dijital veri günlüğü"><i data-icon="List"></i><span>Dijital veri günlüğü</span></button>
        <div class="nav-divider"></div><span class="nav-label">SİSTEM</span>
        <button data-view="spectrum" title="Yönetici spektrumu"><i data-icon="Activity"></i><span>Spektrum</span><i data-icon="LockKeyhole"></i></button>
        <button data-view="sources" title="Kaynaklar ve ayarlar"><i data-icon="Cable"></i><span>Kaynaklar ve ayarlar</span></button>
        <button data-view="about" title="BIEM hakkında"><i data-icon="CircleHelp"></i><span>BİEM</span></button>
      </nav>
      <div class="sidebar-bottom"><span class="sidebar-kicker">SÜREÇ YETKİSİ</span><div id="permission-state"></div><small>Windows süreç durumu</small><div class="sidebar-version">RADIA <span>0.2.0 · brif referansı</span></div></div>
    </aside>
    <main id="main" tabindex="-1"></main>
    <footer class="system-footer"><span id="footer-state"></span><span>12 Eylül 2026 · 14:32:18 <span class="footer-divider">|</span> Yerel saat · temsili</span></footer>
  </div>
  <aside id="fm-panel" class="fm-panel" hidden aria-label="FM RADIO paneli"></aside>
  <dialog id="drawer" class="drawer" aria-labelledby="drawer-title"></dialog>
  <dialog id="confirmation" class="confirmation" aria-labelledby="confirmation-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
