[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biem-radia"
version = "0.2.0"
description = "BIEM Radio Integrated Solution BM-ICC-08, selective squelch and digital voice archive"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "mapbox-vector-tile>=2.2.0",
    "numpy>=2.2",
    "pillow>=11",
    "scipy>=1.15",
    "sounddevice>=0.5.6",
]

[project.scripts]
biem-icc = "biem_radia.app:main"
biem-radia = "biem_radia.app:main"
biem-icc-server = "biem_radia.server.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
    "basedpyright",
    "pre-commit",
    "uv>=0.12.13",
    "httpx2>=2.13.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/biem_radia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]
# Preserve native Tcl/Tk file handles while capturing Python test output.
addopts = "--capture=sys"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "basic"

[tool.ty.src]
include = ["src"]

[tool.hatch.build.targets.sdist]
include = ["/src/biem_radia", "/pyproject.toml", "/README.md", "/docs", "/tests"]
exclude = ["**/*.zip"]
