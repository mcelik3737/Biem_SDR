[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biem-radia"
version = "0.1.0"
description = "BIEM Radia local analog radio recording workstation"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2", "scipy>=1.15"]

[project.scripts]
biem-radia = "biem_radia.app:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
    "basedpyright",
    "pre-commit",
    "uv>=0.12.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/biem_radia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "basic"

[tool.ty.src]
include = ["src"]
